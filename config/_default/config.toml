# Issuenator Website - Main Configuration
# Theme: Congo (https://jpanther.github.io/congo/)

baseURL = "https://issuenator.app/"
languageCode = "en"
title = "Issuenator"
defaultContentLanguage = "en"

enableRobotsTXT = true
paginate = 10
summaryLength = 30

# Theme module
[module]
  [[module.imports]]
    path = "github.com/jpanther/congo/v2"

# Markup configuration
[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

# Taxonomies
[taxonomies]
  tag = "tags"

# Outputs for search functionality
[outputs]
  home = ["HTML", "RSS", "JSON"]

# Sitemap
[sitemap]
  changefreq = "weekly"
  priority = 0.5

# Build settings
[build]
  writeStats = true
